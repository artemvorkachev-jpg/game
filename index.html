<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101326"><title>Тетрис — Game</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#252b50,#101326 65%);color:#f5f6ff;font:16px system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:18px 12px}main{width:min(100%,650px)}header{text-align:center}h1{font-size:clamp(2rem,8vw,3rem);letter-spacing:.15em;margin:0}header p{color:#b5bddf;margin:4px 0 18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:12px;align-items:start}.board,.panel{background:#171b31;border:1px solid #343c63;border-radius:14px;padding:10px}.board{position:relative}canvas{display:block;width:100%;height:auto;border-radius:7px}aside{display:grid;gap:10px}.panel h2{font-size:.75rem;color:#aeb7dc;letter-spacing:.1em;margin:0 0 7px;text-transform:uppercase}.score{font-size:1.7rem;font-weight:800}.stats{display:grid;gap:6px}.stats div{background:#101428;border-radius:8px;padding:7px}.stats small{display:block;color:#aeb7dc;font-size:.7rem}.stats strong{font-size:1.05rem}button{border:1px solid #454e7b;border-radius:10px;background:#2a3155;color:white;padding:10px;font:inherit;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}.primary{background:#7c6cff;border:0;font-weight:700}.actions{display:grid;gap:7px}.hint{font-size:.72rem;color:#aeb7dc;margin:3px 0 0}.overlay{position:absolute;inset:10px;border-radius:8px;background:#101326df;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}.overlay[hidden]{display:none}.overlay h2{font-size:1.5rem;margin:0 0 6px}.overlay p{color:#b5bddf}.mobile{display:none;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.mobile button{font-size:1.2rem;min-height:46px}.mobile .wide{grid-column:span 2}.status{color:#c7c0ff;font-size:.85rem;min-height:1.5em;margin-top:9px}footer{text-align:center;color:#aeb7dc;font-size:.75rem;margin-top:8px}@media(max-width:520px){.layout{grid-template-columns:minmax(0,1fr) 105px;gap:7px}.board{padding:6px}.panel{padding:8px}.score{font-size:1.3rem}.panel h2{font-size:.65rem}.actions button{font-size:.75rem;padding:9px 3px}.mobile{display:grid}.hint{font-size:.66rem}}
</style></head>
<body><main><header><h1>ТЕТРИС</h1><p>Собирай линии. Побей рекорд!</p></header>
<div class="layout"><section class="board" aria-label="Игровое поле"><canvas id="board" width="300" height="600"></canvas><div class="overlay" id="overlay"><div><h2 id="ovtitle">Готов играть?</h2><p id="ovtext">Нажми «Старт», чтобы начать</p><button type="button" class="primary" id="ovbtn">Старт</button></div></div></section>
<aside><section class="panel"><h2>Следующая</h2><canvas id="next" width="120" height="90"></canvas></section><section class="panel"><h2>Очки</h2><div class="score" id="score">0</div><div class="stats"><div><small>Линии</small><strong id="lines">0</strong></div><div><small>Уровень</small><strong id="level">1</strong></div><div><small>Рекорд</small><strong id="best">0</strong></div></div></section><section class="panel actions"><button type="button" class="primary" id="start">▶ Старт / заново</button><button type="button" id="pause">Ⅱ Пауза</button><p class="hint">← → движение · ↑ поворот · пробел — сброс</p></section></aside></div>
<div class="mobile"><button data-a="left" aria-label="Влево">←</button><button data-a="rotate" aria-label="Повернуть">↻</button><button data-a="right" aria-label="Вправо">→</button><button data-a="down" aria-label="Вниз">↓</button><button class="wide" data-a="drop">Сбросить</button><button class="wide" data-a="pause">Пауза</button></div><div class="status" id="status" role="status" aria-live="polite">Можно играть клавишами или кнопками.</div><footer>Работает в браузере — установка не нужна.</footer></main>
<script>
(()=>{const C=10,R=20,S=30,colors={I:'#37d9f5',O:'#ffcf4a',T:'#ad79ff',S:'#5ce39a',Z:'#ff668d',J:'#5b91ff',L:'#ff9c54'},shapes={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]}};
const $=id=>document.getElementById(id),cv=$('board'),cx=cv.getContext('2d'),nv=$('next'),nx=nv.getContext('2d');let grid,p,next,score=0,lines=0,level=1,best=0,running=false,paused=false,over=false,last=0,acc=0,raf=0;
try{best=+(localStorage.getItem('tetrisBest')||0)}catch{}$('best').textContent=best;
function clone(m){return m.map(r=>r.slice())}function rand(){let t=Object.keys(shapes);t=t[Math.random()*t.length|0];return{t,m:clone(shapes[t]),x:4,y:0}}
function fresh(){grid=Array.from({length:R},()=>Array(C).fill(''));score=lines=0;level=1;p=rand();next=rand();running=true;paused=over=false;last=acc=0;$('overlay').hidden=true;$('pause').textContent='Ⅱ Пауза';$('status').textContent='Удачи!';stats();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function hit(q,dx=0,dy=0,m=q.m){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){let xx=q.x+x+dx,yy=q.y+y+dy;if(xx<0||xx>=C||yy>=R||(yy>=0&&grid[yy][xx]))return true}return false}
function cell(ctx,color,x,y,size){ctx.fillStyle=color;ctx.fillRect(x*size+1,y*size+1,size-2,size-2);ctx.fillStyle='#ffffff35';ctx.fillRect(x*size+3,y*size+3,size-6,Math.max(3,size*.13))}
function draw(){cx.fillStyle='#0c1022';cx.fillRect(0,0,300,600);cx.strokeStyle='#252b49';for(let x=0;x<=C;x++){cx.beginPath();cx.moveTo(x*S,0);cx.lineTo(x*S,600);cx.stroke()}for(let y=0;y<=R;y++){cx.beginPath();cx.moveTo(0,y*S);cx.lineTo(300,y*S);cx.stroke()}if(grid)grid.forEach((row,y)=>row.forEach((c,x)=>{if(c)cell(cx,c,x,y,S)}));if(p){let ghost={...p};while(!hit(ghost,0,1))ghost.y++;ghost.m.forEach((r,y)=>r.forEach((v,x)=>{if(v){cx.globalAlpha=.2;cell(cx,colors[ghost.t],ghost.x+x,ghost.y+y,S);cx.globalAlpha=1}}));p.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)cell(cx,colors[p.t],p.x+x,p.y+y,S)}))}}
function drawNext(){nx.fillStyle='#0c1022';nx.fillRect(0,0,120,90);if(!next)return;let size=20,ox=(120-next.m[0].length*size)/2,oy=(90-next.m.length*size)/2;next.m.forEach((r,y)=>r.forEach((v,x)=>{if(v){nx.fillStyle=colors[next.t];nx.fillRect(ox+x*size+1,oy+y*size+1,size-3,size-3)}}))}
function stats(){ $('score').textContent=score;$('lines').textContent=lines;$('level').textContent=level;$('best').textContent=best;drawNext()}
function lock(){p.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&p.y+y>=0)grid[p.y+y][p.x+x]=colors[p.t]}));let n=0;for(let y=R-1;y>=0;y--)if(grid[y].every(Boolean)){grid.splice(y,1);grid.unshift(Array(C).fill(''));n++;y++}if(n){score+=([0,100,300,500,800][n]||800)*level;lines+=n;level=1+(lines/10|0);$('status').textContent=['','Отлично!','Две линии!','Тройная!','ТЕТРИС!'][n]||'Линии очищены!'}if(score>best){best=score;try{localStorage.setItem('tetrisBest',best)}catch{}}p=next;next=rand();if(hit(p))end();stats()}
function end(){running=false;over=true;$('overlay').hidden=false;$('ovtitle').textContent='Игра окончена';$('ovtext').textContent='Очки: '+score+' · Линии: '+lines;$('ovbtn').textContent='Играть ещё';$('status').textContent='Конец игры — попробуй ещё раз.'}
function act(a){if(a==='pause'){if(!running)return;paused=!paused;$('overlay').hidden=!paused;$('pause').textContent=paused?'▶ Продолжить':'Ⅱ Пауза';if(paused){$('ovtitle').textContent='Пауза';$('ovtext').textContent='Продолжи, когда будешь готов.';$('ovbtn').textContent='Продолжить'}else{last=0;raf=requestAnimationFrame(loop)}return}if(!running||paused)return;if(a==='left'&&!hit(p,-1))p.x--;if(a==='right'&&!hit(p,1))p.x++;if(a==='down'){if(!hit(p,0,1)){p.y++;score++}else lock();stats()}if(a==='rotate'){let m=p.m[0].map((_,i)=>p.m.map(r=>r[i]).reverse());for(let d of [0,-1,1,-2,2])if(!hit(p,d,0,m)){p.x+=d;p.m=m;break}}if(a==='drop'){let d=0;while(!hit(p,0,1)){p.y++;d++}score+=d*2;lock()}draw()}
function loop(t=0){if(!running||paused)return;acc+=last?t-last:0;last=t;if(acc>Math.max(90,800-(level-1)*65)){if(!hit(p,0,1))p.y++;else lock();acc=0}draw();raf=requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{let map={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'rotate',' ':'drop',a:'left',d:'right',s:'down',w:'rotate',p:'pause',Escape:'pause'};if(map[e.key]){e.preventDefault();act(map[e.key])}if(e.key==='Enter'&&(!running||over))fresh()});
document.querySelectorAll('[data-a]').forEach(b=>{b.addEventListener('click',()=>act(b.dataset.a));let timer;b.addEventListener('pointerdown',e=>{if(['left','right','down'].includes(b.dataset.a)){e.preventDefault();act(b.dataset.a);timer=setInterval(()=>act(b.dataset.a),130)}});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearInterval(timer)))});
$('start').addEventListener('click',e=>{e.preventDefault();fresh()});$('pause').addEventListener('click',e=>{e.preventDefault();act('pause')});$('ovbtn').addEventListener('click',e=>{e.preventDefault();if(paused)act('pause');else fresh()});grid=Array.from({length:R},()=>Array(C).fill(''));p=null;next=rand();draw();drawNext();
})();
</script></body></html>
