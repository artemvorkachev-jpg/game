<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101326"><title>Тетрис — Game</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#252b50,#101326 65%);color:#f5f6ff;font:16px system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:18px 12px}main{width:min(100%,650px)}header{text-align:center}h1{font-size:clamp(2rem,8vw,3rem);letter-spacing:.15em;margin:0}header p{color:#b5bddf;margin:4px 0 18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:12px;align-items:start}.board,.panel{background:#171b31;border:1px solid #343c63;border-radius:14px;padding:10px}.board{position:relative}canvas{display:block;width:100%;height:auto;border-radius:7px}aside{display:grid;gap:10px}.panel h2{font-size:.75rem;color:#aeb7dc;letter-spacing:.1em;margin:0 0 7px;text-transform:uppercase}.score{font-size:1.7rem;font-weight:800}.stats{display:grid;gap:6px}.stats div{background:#101428;border-radius:8px;padding:7px}.stats small{display:block;color:#aeb7dc;font-size:.7rem}.stats strong{font-size:1.05rem}button{border:1px solid #454e7b;border-radius:10px;background:#2a3155;color:white;padding:10px;font:inherit;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}.primary{background:#7c6cff;border:0;font-weight:700}.actions{display:grid;gap:7px}.hint{font-size:.72rem;color:#aeb7dc;margin:3px 0 0}.overlay{position:absolute;inset:10px;border-radius:8px;background:#101326df;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}.overlay[hidden]{display:none}.overlay h2{font-size:1.5rem;margin:0 0 6px}.overlay p{color:#b5bddf}.mobile{display:none;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.mobile button{font-size:1.2rem;min-height:46px}.mobile .wide{grid-column:span 2}.status{color:#c7c0ff;font-size:.85rem;min-height:1.5em;margin-top:9px}footer{text-align:center;color:#aeb7dc;font-size:.75rem;margin-top:8px}@media(max-width:520px){.layout{grid-template-columns:minmax(0,1fr) 105px;gap:7px}.board{padding:6px}.panel{padding:8px}.score{font-size:1.3rem}.panel h2{font-size:.65rem}.actions button{font-size:.75rem;padding:9px 3px}.mobile{display:grid}.hint{font-size:.66rem}}
</style></head>
<body><main><header><h1>ТЕТРИС</h1><p>Собирай линии. Побей рекорд!</p></header>
<div class="layout"><section class="board" aria-label="Игровое поле"><canvas id="board" width="300" height="600"></canvas><div class="overlay" id="overlay"><div><h2 id="ovtitle">Готов играть?</h2><p id="ovtext">Нажми «Старт», чтобы начать</p><button type="button" class="primary" id="ovbtn" onclick="window.startTetris && window.startTetris()">Старт</button></div></div></section>
<aside><section class="panel"><h2>Следующая</h2><canvas id="next" width="120" height="90"></canvas></section><section class="panel"><h2>Очки</h2><div class="score" id="score">0</div><div class="stats"><div><small>Линии</small><strong id="lines">0</strong></div><div><small>Уровень</small><strong id="level">1</strong></div><div><small>Рекорд</small><strong id="best">0</strong></div></div></section><section class="panel actions"><button type="button" class="primary" id="start" onclick="window.startTetris && window.startTetris()">▶ Старт / заново</button><button type="button" id="pause">Ⅱ Пауза</button><p class="hint">← → движение · ↑ поворот · пробел — сброс</p></section></aside></div>
<div class="mobile"><button data-a="left" aria-label="Влево">←</button><button data-a="rotate" aria-label="Повернуть">↻</button><button data-a="right" aria-label="Вправо">→</button><button data-a="down" aria-label="Вниз">↓</button><button class="wide" data-a="drop">Сбросить</button><button class="wide" data-a="pause">Пауза</button></div><div class="status" id="status" role="status" aria-live="polite">Можно играть клавишами или кнопками.</div><footer>Работает в браузере — установка не нужна.</footer></main>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const board=$('board'), ctx=board.getContext('2d');
  const nextCanvas=$('next'), nctx=nextCanvas.getContext('2d');
  const W=10,H=20,S=30;
  const shapes={
    I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],
    S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],
    J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]
  };
  const colors={I:'#37d9f5',O:'#ffcf4a',T:'#ad79ff',S:'#5ce39a',Z:'#ff668d',J:'#5b91ff',L:'#ff9c54'};
  let grid,piece,next,score=0,lines=0,level=1,best=0,running=false,paused=false,raf=0,last=0,acc=0;
  const copy=m=>m.map(r=>r.slice());
  function randomPiece(){const keys=Object.keys(shapes),t=keys[Math.floor(Math.random()*keys.length)];return {t,m:copy(shapes[t]),x:Math.floor((W-shapes[t][0].length)/2),y:0};}
  function collision(p,dx=0,dy=0,m=p.m){
    for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){
      const xx=p.x+x+dx, yy=p.y+y+dy;
      if(xx<0||xx>=W||yy>=H||(yy>=0&&grid[yy][xx]))return true;
    } return false;
  }
  function drawCell(c,color,x,y,size){c.fillStyle=color;c.fillRect(x*size+1,y*size+1,size-2,size-2);}
  function draw(){
    ctx.fillStyle='#0c1022';ctx.fillRect(0,0,300,600);ctx.strokeStyle='#252b49';
    for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,600);ctx.stroke();}
    for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(300,y*S);ctx.stroke();}
    if(grid)grid.forEach((row,y)=>row.forEach((color,x)=>{if(color)drawCell(ctx,color,x,y,S)}));
    if(piece)piece.m.forEach((row,y)=>row.forEach((v,x)=>{if(v)drawCell(ctx,colors[piece.t],piece.x+x,piece.y+y,S)}));
  }
  function drawNext(){
    nctx.fillStyle='#0c1022';nctx.fillRect(0,0,120,90);if(!next)return;
    const size=20,ox=(120-next.m[0].length*size)/2,oy=(90-next.m.length*size)/2;
    next.m.forEach((row,y)=>row.forEach((v,x)=>{if(v)drawCell(nctx,colors[next.t],(ox/size)+x,(oy/size)+y,size)}));
  }
  function stats(){$('score').textContent=score;$('lines').textContent=lines;$('level').textContent=level;$('best').textContent=best;drawNext();}
  function showOverlay(title,desc,label){$('overlay').hidden=false;$('ovtitle').textContent=title;$('ovtext').textContent=desc;$('ovbtn').textContent=label;}
  function start(){
    grid=Array.from({length:H},()=>Array(W).fill(''));score=0;lines=0;level=1;
    piece=randomPiece();next=randomPiece();running=true;paused=false;last=0;acc=0;
    $('overlay').hidden=true;$('status').textContent='Удачи!';$('pause').textContent='Ⅱ Пауза';
    stats();draw();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  }
  function finish(){running=false;showOverlay('Игра окончена','Очки: '+score+' · Линии: '+lines,'Играть ещё');$('status').textContent='Конец игры — попробуй ещё раз.';}
  function lock(){
    piece.m.forEach((row,y)=>row.forEach((v,x)=>{if(v&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=colors[piece.t];}));
    let n=0;for(let y=H-1;y>=0;y--)if(grid[y].every(Boolean)){grid.splice(y,1);grid.unshift(Array(W).fill(''));n++;y++;}
    if(n){score+=([0,100,300,500,800][n]||800)*level;lines+=n;level=1+Math.floor(lines/10);}
    if(score>best){best=score;try{localStorage.setItem('tetrisBest',String(best));}catch(e){}}
    piece=next;next=randomPiece();if(collision(piece))finish();stats();
  }
  function action(a){
    if(a==='pause'){if(!running)return;paused=!paused;if(paused){cancelAnimationFrame(raf);showOverlay('Пауза','Продолжи, когда будешь готов.','Продолжить');$('pause').textContent='▶ Продолжить';}else{$('overlay').hidden=true;$('pause').textContent='Ⅱ Пауза';last=0;raf=requestAnimationFrame(loop);}return;}
    if(!running||paused)return;
    if(a==='left'&&!collision(piece,-1,0))piece.x--;
    if(a==='right'&&!collision(piece,1,0))piece.x++;
    if(a==='down'){if(!collision(piece,0,1)){piece.y++;score++;}else lock();stats();}
    if(a==='rotate'){const m=piece.m[0].map((_,i)=>piece.m.map(r=>r[i]).reverse());for(const d of [0,-1,1,-2,2])if(!collision(piece,d,0,m)){piece.x+=d;piece.m=m;break;}}
    if(a==='drop'){while(!collision(piece,0,1))piece.y++;lock();}
    draw();
  }
  function loop(t){if(!running||paused)return;acc+=last?t-last:0;last=t;if(acc>Math.max(90,800-(level-1)*65)){if(!collision(piece,0,1))piece.y++;else lock();acc=0;}draw();raf=requestAnimationFrame(loop);}
  function safeStart(e){if(e)e.preventDefault();start();}
  $('start').addEventListener('click',safeStart);
  $('ovbtn').addEventListener('click',function(e){e.preventDefault();if(paused)action('pause');else start();});
  $('pause').addEventListener('click',function(e){e.preventDefault();action('pause');});
  document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.a)));
  document.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'rotate',' ':'drop',a:'left',d:'right',s:'down',w:'rotate',p:'pause',Escape:'pause'};if(map[e.key]){e.preventDefault();action(map[e.key]);}if(e.key==='Enter'&&!running)start();});
  try{best=Number(localStorage.getItem('tetrisBest')||0);}catch(e){}
  grid=Array.from({length:H},()=>Array(W).fill(''));next=randomPiece();stats();draw();
  window.startTetris=start;
  $('status').textContent='Код игры загружен. Нажми «Старт».';
  window.addEventListener('error',e=>{$('status').textContent='Ошибка игры: '+e.message;});
})();
</script></body></html>
